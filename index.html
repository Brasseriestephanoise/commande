<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">

<meta name="robots" content="noindex">
<meta name="theme-color" content="#17936F">

<meta name="description" content="Bières bio brassées à Saint-Étienne, à l’unité, en carton ou en coffret cadeau, à des tarifs négociés. Commandez en 2 minutes.">

<meta property="og:site_name" content="La Brasserie Stéphanoise">
<meta property="og:title" content="Commande groupée Brasserie Stéphanoise · Tarifs négociés">
<meta property="og:description" content="Bières bio brassées à Saint-Étienne, à l’unité, en carton ou en coffret cadeau. Commandez en 2 minutes.">

<style>
body{margin:0;background:#F7F2E8;color:#231F20;font-family:"Arial Narrow",Arial,sans-serif;text-align:center;padding:24vh 24px 0}
.logo{display:inline-block;background:#FCFAF4;border-radius:8px;padding:10px 16px}
.logo img{height:40px;display:block}
.spin{width:34px;height:34px;margin:28px auto 18px;border:4px solid #E6DCCC;border-top-color:#17936F;border-radius:50%;animation:t 1s linear infinite}
@keyframes t{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
h1{font-size:20px;margin:0 0 6px}
p{color:#6E645B;margin:0;font-size:16px;line-height:1.4}
@media (prefers-color-scheme:dark){body{background:#181614;color:#F2ECE2}p{color:#A99E92}.spin{border-color:#38322C;border-top-color:#3DBB94}}
</style>
</head><body>
<span class="logo"><img src="https://brasseriestephanoise.github.io/commande/img/logo.png" alt="La Brasserie Stéphanoise"></span>
<div class="spin" id="s" aria-hidden="true"></div>
<h1 id="h">Chargement de votre commande…</h1>
<p id="m">Cela peut prendre quelques secondes, merci de patienter.</p>
<script>
// La page complète est servie par le Google Sheet « Commandes CSE » (fichier App de son Apps Script).
// Appels sans cookie Google : fonctionne quel que soit le nombre de comptes ouverts.
(function () {
var API = "https://script.google.com/macros/s/AKfycbzRSQ0lBMRcvBiTjXZc9tGEtW9TJKibLfzpJFHbwQPFPf2Yb-iZhp-pJGbdl6ILf9oR/exec";
var P = new URLSearchParams(location.search);
var lent = setTimeout(function(){ document.getElementById("m").textContent = "Encore quelques secondes : la première ouverture est un peu plus longue."; }, 8000);
// Google répond parfois lentement : si rien n'est revenu au bout de 7 s, on relance une requête
// en parallèle (4 au maximum) et on garde la première réponse. Abandon au bout de 60 s.
function get(q) {
  return new Promise(function (ok, ko) {
    var done = false, n = 0, fails = 0, iv, cap;
    function end(f, v) { if (done) return; done = true; clearInterval(iv); clearTimeout(cap); f(v); }
    function go() {
      if (done || n >= 4) return; n++;
      fetch(API + q + "&_=" + Date.now() + n, {credentials:"omit"})
        .then(function(r){ if(!r.ok) throw 0; return r.text(); })
        .then(function(t){ end(ok, t); })
        .catch(function(){ fails++; if (fails >= n) { if (n >= 4) end(ko, 0); else go(); } });
    }
    iv = setInterval(go, 7000); cap = setTimeout(function(){ end(ko, 0); }, 60000);
    go();
  });
}
// La page elle-même (app.html) est servie par GitHub, rapide ; secours : la copie du Google Sheet.
var app = fetch("app.html?v=" + Date.now()).then(function(r){ if(!r.ok) throw 0; return r.text(); })
  .catch(function(){ return get("?api=app"); });
var data = (P.get("cse") && !P.get("desinscription"))
  ? get(P.has("cle") ? "?api=suivi&cse=" + encodeURIComponent(P.get("cse")) + "&cle=" + encodeURIComponent(P.get("cle")) : "?api=page&cse=" + encodeURIComponent(P.get("cse"))).then(function(s){ return JSON.parse(s); }).catch(function(){ return null; })
  : Promise.resolve(null);
Promise.all([app, data])
  .then(function(v){ clearTimeout(lent); window.__PRE = v[1]; document.open(); document.write(v[0]); document.close(); })
  .catch(function(){ clearTimeout(lent); document.getElementById("s").style.display = "none"; document.getElementById("h").textContent = "La page n’a pas pu se charger"; document.getElementById("m").textContent = "Vérifiez votre connexion internet puis rechargez la page."; });
})();
</script>
</body></html>
