<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<title>Espace brasserie</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>

html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
:root{
  --bg:#F5F1E8; --surface:#FFFDF8; --line:#E3DACA; --ink:#231F20; --muted:#6E645B;
  --accent:#17936F; --accent-ink:#FFFFFF; --accent-soft:#E2F2EC;
  --warn:#B4541A; --warn-soft:#FBEBDD; --closed:#857A6F; --closed-soft:#EEE8DE;
  --info:#2E6FA8; --info-soft:#E3EEF8; --mock:#FFF3C4; --mock-ink:#6A5300;
  --display:"Roboto Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171513; --surface:#211E1B; --line:#3A342E; --ink:#F2ECE2; --muted:#A99E92;
  --accent:#3DBB94; --accent-ink:#0E1A15; --accent-soft:#1D3229;
  --warn:#F0A06A; --warn-soft:#3A2617; --closed:#A99E92; --closed-soft:#2C2723;
  --info:#7DB3E6; --info-soft:#1C2A38; --mock:#3A3215; --mock-ink:#F2D98A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171513; --surface:#211E1B; --line:#3A342E; --ink:#F2ECE2; --muted:#A99E92;
  --accent:#3DBB94; --accent-ink:#0E1A15; --accent-soft:#1D3229;
  --warn:#F0A06A; --warn-soft:#3A2617; --closed:#A99E92; --closed-soft:#2C2723;
  --info:#7DB3E6; --info-soft:#1C2A38; --mock:#3A3215; --mock-ink:#F2D98A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:28px;font-weight:800}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mock{background:var(--mock);color:var(--mock-ink);font-size:13px}
.mock .wrap{padding-block:7px}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{display:inline-flex}
.brand img{height:34px;width:auto;display:block}
.brand b{font-family:var(--display);font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
nav.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:6px;font-family:var(--display);font-weight:700;font-size:15px;color:var(--muted);cursor:pointer}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
main{padding-block:24px 64px;display:grid;gap:22px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head p{margin:4px 0 0}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn:focus-visible,nav.tabs button:focus-visible,input:focus-visible,select:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi b{display:block;font-family:var(--display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:14px;min-width:0}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--display);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer}
tbody tr.row:hover td{background:var(--bg)}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.open{background:var(--accent-soft);color:var(--accent)}
.pill.soon{background:var(--warn-soft);color:var(--warn)}
.pill.closed{background:var(--closed-soft);color:var(--closed)}
.pill.draft{background:var(--info-soft);color:var(--info)}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:5px;padding:1px 7px;color:var(--muted);white-space:nowrap}
.tag.resale{border-color:var(--info);color:var(--info)}
.dot{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:8px;border:1px solid rgba(0,0,0,.12)}
.sub{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.field{display:grid;gap:4px}
.field label{font-weight:600;font-size:13px}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:8px 10px;width:100%}
.price{width:78px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 7px;text-align:right;font-variant-numeric:tabular-nums}
.price:disabled{opacity:.4}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.switch{appearance:none;width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;vertical-align:middle;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch:checked{background:var(--accent)}
.switch:checked::after{left:17px}
@media (prefers-reduced-motion:reduce){.switch::after{transition:none}}
.group td{background:var(--bg);font-family:var(--display);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-block:6px}
tr.off td:not(:first-child){opacity:.45}
.links{display:grid;gap:10px}
.link{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg)}
.link .l{flex:1 1 260px;min-width:0}
.link code{display:block;font-size:12.5px;word-break:break-all;color:var(--muted)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--info-soft);border-radius:8px;padding:10px 12px;font-size:14px}
.tools input{width:64px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.sum div{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.sum b{display:block;font-family:var(--display);font-size:21px;font-variant-numeric:tabular-nums}
.sum span{font-size:13px;color:var(--muted)}
.sum .hl{border-color:var(--accent);background:var(--accent-soft)}
.back{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:0;font-size:14px}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:8px;cursor:pointer;text-align:left}
.gcard:hover{border-color:var(--accent)}
.gcard.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.note{font-size:13px;color:var(--muted);margin:0}
.preview{border:1px dashed var(--line);border-radius:10px;padding:14px;display:grid;gap:12px}
.dialog-bg{position:fixed;inset:0;background:rgba(20,16,12,.45);display:grid;place-items:center;z-index:15;padding:16px}
.dialog{background:var(--surface);border-radius:12px;padding:20px;max-width:420px;width:100%;display:grid;gap:12px}
@media (max-width:640px){h1{font-size:23px}nav.tabs{margin-left:0;width:100%}.top .wrap{gap:8px}}
</style>
</head><body>

<main class="wrap" id="app"><p class="muted">Chargement…</p></main>
<div id="toastHost"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const API = "https://script.google.com/macros/s/AKfycbxUl_7wwTnrGuGumvA2O6aTi0VBv19FaOEdy6ddojMo7eSRgPd-XdzV0oYLAuAYNbU/exec";
const TEST = true;

let KEY = "";
try { KEY = localStorage.getItem("bs_espace_k") || ""; } catch (e) {}
const hk = (location.hash.match(/k=([A-Za-z0-9]+)/) || [])[1];
if (hk) { KEY = hk; try { localStorage.setItem("bs_espace_k", hk); } catch (e) {} history.replaceState(null, "", location.pathname); }
if (TEST) document.getElementById("testBanner").hidden = false;
const BASE = new URL("./", location.href).href;

const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur = v => v == null || v === "" ? "–" : Number(v).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2}) + " €";
const dfr = s => s ? new Date(s + "T12:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"}) : "–";
const TODAY = new Date(); TODAY.setHours(12,0,0,0);
const daysTo = s => Math.round((new Date(s + "T12:00") - TODAY) / 864e5);
const clone = o => JSON.parse(JSON.stringify(o));
const num = s => { const n = parseFloat(String(s).replace(",", ".").replace(/[^\d.-]/g, "")); return isNaN(n) ? null : n; };
const fx = v => v == null ? "" : Number(v).toFixed(2).replace(".", ",");
const slug = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40);
function toast(t){ const h=$("#toastHost"); h.innerHTML=`<div class="toast" role="status">${esc(t)}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>h.innerHTML="",3000); }
function copy(t){ (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Lien copié")).catch(()=>toast("Copie impossible : sélectionne le lien à la main")); }

async function api(op, data){
  const r = await fetch(API, {method:"POST", credentials:"omit", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(Object.assign({action:"admin", k:KEY, op}, data||{}))});
  const j = await r.json();
  if (!j.ok) { if (j.auth) { try { localStorage.removeItem("bs_espace_k"); } catch (e) {} KEY=""; S.view="login"; render(); } throw new Error(j.error || "Erreur"); }
  return j;
}
let busy = false;
async function run(label, fn){ if(busy) return; busy=true; document.body.style.cursor="progress"; try { await fn(); } catch(e){ toast(e.message || "Erreur"); } finally { busy=false; document.body.style.cursor=""; } }

let D = null;            // {ventes, grilles, catalogue, url}
let P = [], byId = {};   // catalogue
const CATS = [["classique","Bières classiques"],["speciale","Bières spéciales"],["soft","Softs"],["box","Coffrets"]];
const FALL = {b33:true,b75:true,soft:true,box:true};
const FMTS = [["b33","Carton bière 12 × 33 cl"],["b75","Carton bière 6 × 75 cl"],["soft","Carton soft 12 × 33 cl"],["box","Coffrets"]];
function setCat(c){ P = c; byId = Object.fromEntries(P.map(p=>[p.id,p])); }
function basePrix(){ const o={}; P.forEach(p=>{ o[p.id] = p.cat==="box" ? {on:p.dispo,b:p.p} : {on:p.dispo,b33:p.p33,b75:p.cat==="soft"?null:p.p75}; }); return o; }
function grillesAll(){ return [{id:"cse",nom:"CSE classique",desc:"Les prix de base du catalogue. Grille par défaut.",resale:false,locked:true,formats:clone(FALL),prix:basePrix()}].concat(D.grilles); }
function fillPrix(prix){ const o=clone(prix||{}); P.forEach(p=>{ if(!o[p.id]) o[p.id] = p.cat==="box"?{on:false,b:p.p}:{on:false,b33:p.p33,b75:p.cat==="soft"?null:p.p75}; }); return o; }
function status(v){ if(!v.ouvert) return {k:"closed",t:"Close"}; if(v.limite){ const d=daysTo(v.limite); if(d<=7) return {k:"soon",t:d<=0?"Dernier jour":"Clôture dans "+d+" j"}; } return {k:"open",t:"Ouverte"}; }
const venteUrl = v => BASE + "?cse=" + encodeURIComponent(v.code);
const suiviUrl = v => BASE + "?cse=" + encodeURIComponent(v.code) + "&cle=" + v.cle;

const S = {view: KEY ? "ventes" : "login", cur:null, tab:"apercu", exp:null, draft:null, grille:null, gedit:null, rmode:"eur",
  rule:{eur:{c33:1,c75:2,s33:1,s75:2,so:.8,bx:4}, pct:{c33:50,c75:40,s33:40,s75:40,so:35,bx:20}}, catEdit:null, newProd:null};
function go(view, extra){ Object.assign(S, {view}, extra||{}); render(); window.scrollTo({top:0}); }

function vLogin(){
  return `<div class="head"><div><h1>Espace brasserie</h1><p class="muted">Pour entrer, colle ici ton lien d’accès personnel (il se termine par <code>#k=…</code>).</p></div></div>
  <section class="card"><div class="field"><label for="lk">Lien d’accès</label><input id="lk" placeholder="https://…/espace.html#k=…"></div>
  <div class="bar"><button class="btn primary" type="button" data-login>Entrer</button></div>
  <p class="note">Tu obtiens ce lien dans le Google Sheet : menu Commandes CSE › Lien de l’Espace brasserie. Ne le partage pas : il donne accès à toutes les ventes.</p></section>`;
}

function vVentes(){
  const vs = D.ventes.slice().sort((a,b)=> (b.ouvert-a.ouvert) || String(a.limite||"9").localeCompare(String(b.limite||"9")));
  const open = vs.filter(v=>v.ouvert);
  const fac = open.reduce((a,v)=>a+v.aFacturer,0), cmd = open.reduce((a,v)=>a+v.n,0);
  const rows = vs.map(v=>{const st=status(v);return `<tr class="row" tabindex="0" data-open="${esc(v.code)}">
    <td><b>${esc(v.nom)}</b><div class="sub">${esc(v.resp||"")}</div></td>
    <td><span class="pill ${st.k}">${st.t}</span>${v.livraison&&v.dateOk===false?' <span class="pill soon">Date à confirmer</span>':""}</td>
    <td>${esc(gName(v))}${v.resale?' <span class="tag resale">Revente</span>':""}</td>
    <td class="num">${dfr(v.limite)}</td><td class="num">${v.livraison?dfr(v.livraison):esc(v.livraisonTxt||"–")}</td>
    <td class="num">${v.n}</td><td class="num">${eur(v.aFacturer)}</td></tr>`;}).join("");
  return `<div class="head"><div><h1>Ventes groupées</h1><p class="muted">Toutes tes ventes, ouvertes et passées.</p></div>
    <div class="bar"><button class="btn" type="button" data-refresh>Actualiser</button><button class="btn primary" type="button" data-new>+ Nouvelle vente</button></div></div>
  <div class="kpis">
    <div class="kpi"><b>${open.length}</b><span>ventes ouvertes</span></div>
    <div class="kpi"><b>${cmd}</b><span>commandes sur les ventes ouvertes</span></div>
    <div class="kpi"><b>${eur(fac)}</b><span>à facturer sur les ventes ouvertes</span></div>
    <div class="kpi"><b>${open.filter(v=>status(v).k==="soon").length}</b><span>clôture dans les 7 jours</span></div>
  </div>
  <section class="card"><div class="scroll"><table>
    <thead><tr><th>Client</th><th>Statut</th><th>Grille de prix</th><th class="num">Date limite</th><th class="num">Livraison</th><th class="num">Commandes</th><th class="num">À facturer</th></tr></thead>
    <tbody>${rows || `<tr><td colspan="7" class="muted">Aucune vente pour l’instant.</td></tr>`}</tbody></table></div></section>`;
}
function gName(v){ if(!v.configured||v.grille==="cse") return "CSE classique"; const g=D.grilles.find(x=>x.id===v.grille); return g?g.nom:(v.grille?"Grille supprimée":"Personnalisée"); }

function vVente(){
  const C = S.cur, v = C.vente, cf = C.config, st = status(v), t = totals();
  const tabs = [["apercu","Aperçu"],["infos","Infos"],["produits","Produits et prix"],["commandes","Commandes ("+C.orders.length+")"],["exports","Récaps"]];
  let body = "";
  if (S.tab==="apercu") body = `<div class="sum">
      ${cf.resale?`<div><b>${eur(t.enc)}</b><span>payé par les acheteurs</span></div><div class="hl"><b>${eur(t.fac)}</b><span>à facturer à l’organisateur</span></div><div><b>${eur(t.enc-t.fac)}</b><span>marge de l’organisateur</span></div>`
      :`<div class="hl"><b>${eur(t.fac)}</b><span>à facturer</span></div>`}
      <div><b>${C.orders.length}</b><span>commandes</span></div></div>
    ${v.livraison&&v.dateOk===false?`<section class="card" style="border-color:var(--warn)"><h2>Date de livraison à confirmer</h2><p style="margin:0">L’organisateur demande une livraison le <b>${dfr(v.livraison)}</b>${v.limite?" (date limite de commande : "+dfr(v.limite)+")":""}.</p><div class="bar"><button class="btn primary" type="button" data-confirmdate>Confirmer cette date</button><span class="muted">ou</span><input type="date" id="altdate" class="price" style="width:auto"><button class="btn" type="button" data-confirmalt>Confirmer une autre date</button></div><p class="note">L’organisateur reçoit un e-mail de confirmation.</p></section>`:""}
    <section class="card"><h2>Liens</h2><div class="links">
      <div class="link"><div class="l"><b>Lien à diffuser</b> <span class="sub">${cf.resale?"aux adhérents / parents":"aux salariés"}</span><code>${esc(venteUrl(v))}</code></div><button class="btn small" type="button" data-copy="${esc(venteUrl(v))}">Copier</button></div>
      <div class="link"><div class="l"><b>Lien du responsable</b> <span class="sub">suivi des commandes, à ne pas diffuser</span><code>${esc(suiviUrl(v))}</code></div><button class="btn small" type="button" data-copy="${esc(suiviUrl(v))}">Copier</button></div>
    </div></section>
    <section class="card"><h2>Informations</h2><div class="grid2">
      <div><div class="sub">Responsable</div>${esc(v.resp||"–")}<div class="sub" style="margin-top:2px">${esc(v.email||"")} ${esc(v.tel||"")}</div></div>
      <div><div class="sub">Date limite</div>${dfr(v.limite)}${v.limite?" · 23 h 59":""}</div>
      <div><div class="sub">Livraison / retrait</div>${[v.livraison?dfr(v.livraison):v.livraisonTxt,v.lieu].filter(Boolean).map(esc).join(" · ")||"–"}</div>
      <div><div class="sub">Créneau · paiement · contact</div>${esc([v.creneau,v.paiement,v.contact].filter(Boolean).join(" · ")||"–")}</div>
      <div><div class="sub">Date de livraison</div>${v.livraison?(v.dateOk===false?"À confirmer":"Confirmée"):"–"}</div>
      <div><div class="sub">Formats</div>${FMTS.filter(([k])=>cf.formats[k]).map(([,l])=>l).join(", ")}</div>
    </div>${cf.configured?"":`<p class="note">Vente créée avant l’Espace brasserie : elle garde le fonctionnement d’origine (catalogue et prix de base, sans softs) tant que tu n’enregistres pas de changement.</p>`}</section>`;
  if (S.tab==="infos") body = `<section class="card"><h2>Infos de la vente</h2>${infoFields(S.edit, false)}
      <div class="bar"><button class="btn primary" type="button" data-saveinfos>Enregistrer</button></div></section>`;
  if (S.tab==="produits") body = `<section class="card"><div class="head"><div><h2>Produits et prix de cette vente</h2><p class="note">Tes changements ici ne touchent que cette vente. Les commandes déjà passées gardent leur prix.</p></div>
      <button class="btn small" type="button" data-savegrid>Enregistrer comme grille…</button></div>
      <div class="bar"><span class="seg" role="group" aria-label="Type de vente"><button type="button" data-ctype="std" data-scope="vente" aria-pressed="${!S.edit.resale}">Standard</button><button type="button" data-ctype="resale" data-scope="vente" aria-pressed="${S.edit.resale}">Revente avec marge</button></span></div>
      ${priceTable(S.edit.prix, S.edit.resale, "vente", S.edit.formats)}
      <div class="bar"><button class="btn primary" type="button" data-saveprix>Enregistrer les produits et prix</button></div></section>`;
  if (S.tab==="commandes") body = `<section class="card"><div class="scroll"><table><thead><tr><th class="num">N°</th><th>Nom</th><th>Service</th><th>Détail</th><th class="num">${cf.resale?"Payé par l’acheteur":"Montant"}</th>${cf.resale?'<th class="num">Prix brasserie</th>':""}</tr></thead>
    <tbody>${C.orders.map(o=>`<tr><td class="num">${o.n}</td><td><b>${esc(o.prenom)} ${esc(o.nom)}</b><div class="sub">${esc(o.date)}</div></td><td class="muted">${esc(o.service)}</td><td class="sub">${detail(o)}</td><td class="num">${eur(o.montant)}</td>${cf.resale?`<td class="num">${eur(o.montantB==null?o.montant:o.montantB)}</td>`:""}</tr>`).join("") || `<tr><td colspan="6" class="muted">Aucune commande pour l’instant.</td></tr>`}</tbody></table></div></section>`;
  if (S.tab==="exports") body = vExports();
  return `<div><button class="back" type="button" data-nav="ventes">← Toutes les ventes</button></div>
  <div class="head"><div><h1>${esc(v.nom)}</h1><p><span class="pill ${st.k}">${st.t}</span> <span class="muted">${v.limite?"· clôture le "+dfr(v.limite):""}</span></p></div>
    <div class="bar">${!v.ouvert?`<button class="btn" type="button" data-reopen>Rouvrir</button>`:`${v.limite?`<button class="btn" type="button" data-extend>Prolonger d’une semaine</button>`:""}<button class="btn" type="button" data-close>Fermer la vente</button>`}</div></div>
  <div class="seg" role="group" aria-label="Sections de la vente">${tabs.map(([k,l])=>`<button type="button" data-vtab="${k}" aria-pressed="${S.tab===k}">${l}</button>`).join("")}</div>
  ${body}`;
}
function detail(o){ const p=[]; const nm=id=>byId[id]?byId[id].n:id;
  for(const[k,q]of Object.entries(o.q["33"]||{}))p.push(q+" × "+nm(k)+" 33"); for(const[k,q]of Object.entries(o.q["75"]||{}))p.push(q+" × "+nm(k)+" 75");
  for(const[k,q]of Object.entries(o.q.soft||{}))p.push(q+" × "+nm(k)); for(const[k,q]of Object.entries(o.bx||{}))p.push(q+" × "+nm(k));
  return esc(p.join(", ")) + (o.compo?`<br>${esc(o.compo)}`:""); }
function totals(){ const o=S.cur.orders; return {enc:o.reduce((a,x)=>a+x.montant,0), fac:o.reduce((a,x)=>a+(x.montantB==null?x.montant:x.montantB),0)}; }
function qtyBy(){ const q={}; const add=(id,k,n)=>{q[id]=q[id]||{q33:0,q75:0,soft:0,bx:0}; q[id][k]+=n;};
  S.cur.orders.forEach(o=>{ for(const[k,n]of Object.entries(o.q["33"]||{}))add(k,"q33",n); for(const[k,n]of Object.entries(o.q["75"]||{}))add(k,"q75",n); for(const[k,n]of Object.entries(o.q.soft||{}))add(k,"soft",n); for(const[k,n]of Object.entries(o.bx||{}))add(k,"bx",n); }); return q; }

function vExports(){
  const v=S.cur.vente, cf=S.cur.config, q=qtyBy(), t=totals();
  let html=`<section class="card"><h2>Récaps</h2><div class="grid2">
    <button class="gcard ${S.exp==="prep"?"sel":""}" type="button" data-exp="prep"><h3>Récap de préparation</h3><span class="note">Cartons par format, quantités par produit, liste par personne.</span></button>
    <button class="gcard ${S.exp==="fact"?"sel":""}" type="button" data-exp="fact"><h3>Récap à facturer</h3><span class="note">Lignes au prix brasserie${cf.resale?", avec le total encaissé et la marge de l’organisateur":""}.</span></button></div>`;
  if(S.exp==="prep"){
    let t33=0,t75=0,ts=0,tb=0; const rows=P.filter(p=>q[p.id]).map(p=>{const x=q[p.id];t33+=x.q33;t75+=x.q75;ts+=x.soft;tb+=x.bx;return `<tr><td><span class="dot" style="background:${p.c}"></span>${esc(p.n)}</td><td class="num">${p.cat==="soft"?x.soft||"–":x.q33||"–"}</td><td class="num">${x.q75||"–"}</td><td class="num">${x.bx||"–"}</td></tr>`;}).join("");
    html+=`<div class="preview"><div class="head"><h3>Préparation · ${esc(v.nom)}</h3><div class="bar"><button class="btn small primary" type="button" data-xls="prep">Télécharger Excel</button></div></div>
      <div class="sum">${t33?`<div><b>${t33/12}</b><span>cartons bière 12 × 33 cl · ${t33} bouteilles</span></div>`:""}${t75?`<div><b>${t75/6}</b><span>cartons bière 6 × 75 cl · ${t75} bouteilles</span></div>`:""}${ts?`<div><b>${ts/12}</b><span>cartons soft 12 × 33 cl · ${ts} bouteilles</span></div>`:""}${tb?`<div><b>${tb}</b><span>coffrets</span></div>`:""}</div>
      <div class="scroll"><table><thead><tr><th>Produit</th><th class="num">33 cl</th><th class="num">75 cl</th><th class="num">Coffrets</th></tr></thead><tbody>${rows||`<tr><td colspan="4" class="muted">Aucune commande.</td></tr>`}</tbody></table></div>
      <p class="note">Le fichier Excel contient aussi un onglet « Par personne » (une ligne par commande, une colonne par produit), pour la mise en sachets.</p></div>`;
  }
  if(S.exp==="fact"){
    const L=factLines();
    html+=`<div class="preview"><div class="head"><h3>À facturer · ${esc(v.nom)}</h3><div class="bar"><button class="btn small primary" type="button" data-xls="fact">Télécharger Excel</button></div></div>
      <div class="scroll"><table><thead><tr><th>Produit</th><th class="num">Qté</th><th class="num">Prix brasserie</th><th class="num">Total</th>${cf.resale?'<th class="num">Prix de vente</th><th class="num">Encaissé</th>':""}</tr></thead>
      <tbody>${L.map(l=>`<tr><td>${esc(l[0])}</td><td class="num">${l[1]}</td><td class="num">${eur(l[2])}</td><td class="num">${eur(l[1]*l[2])}</td>${cf.resale?`<td class="num">${eur(l[3])}</td><td class="num">${eur(l[1]*l[3])}</td>`:""}</tr>`).join("")}</tbody>
      <tfoot><tr><td colspan="3">Total</td><td class="num">${eur(t.fac)}</td>${cf.resale?`<td></td><td class="num">${eur(t.enc)}</td>`:""}</tr></tfoot></table></div>
      ${cf.resale?`<p class="note">Marge de l’organisateur : <b>${eur(t.enc-t.fac)}</b>.</p>`:""}
      <p class="note">Prix TTC. Les totaux reprennent le montant réellement enregistré pour chaque commande.</p></div>`;
  }
  return html+`</section>`;
}
function factLines(){ const q=qtyBy(), pr=S.cur.config.prix, L=[];
  P.forEach(p=>{ const x=q[p.id], c=pr[p.id]||{}; if(!x) return;
    if(p.cat==="box"){ if(x.bx) L.push([p.n,x.bx,c.b??p.p,c.v??c.b??p.p]); return; }
    if(x.q33) L.push([p.n+" 33 cl",x.q33,c.b33??p.p33,c.v33??c.b33??p.p33]);
    if(x.soft) L.push([p.n+" 33 cl",x.soft,c.b33??p.p33,c.v33??c.b33??p.p33]);
    if(x.q75) L.push([p.n+" 75 cl",x.q75,c.b75??p.p75,c.v75??c.b75??p.p75]); });
  return L; }

function xls(kind){
  if(!window.XLSX){ toast("Le module Excel n’a pas pu se charger. Vérifie ta connexion."); return; }
  const v=S.cur.vente, cf=S.cur.config, wb=XLSX.utils.book_new(), name=slug(v.nom)||"vente";
  if(kind==="prep"){
    const q=qtyBy(); const a=[["Préparation – "+v.nom],["Livraison : "+(v.livraison?dfr(v.livraison):v.livraisonTxt||"")+(v.lieu?" · "+v.lieu:"")],[],["Produit","33 cl","75 cl","Coffrets"]];
    let t33=0,t75=0,ts=0,tb=0;
    P.filter(p=>q[p.id]).forEach(p=>{const x=q[p.id];t33+=x.q33;t75+=x.q75;ts+=x.soft;tb+=x.bx;a.push([p.n,(p.cat==="soft"?x.soft:x.q33)||"",x.q75||"",x.bx||""]);});
    a.push([],["Cartons bière 12 × 33 cl",t33/12],["Cartons bière 6 × 75 cl",t75/6],["Cartons soft 12 × 33 cl",ts/12],["Coffrets",tb]);
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),"Récap");
    const cols=[]; P.forEach(p=>{ if(p.cat==="box") cols.push([p.n,o=>o.bx[p.id]]); else if(p.cat==="soft") cols.push([p.n,o=>o.q.soft[p.id]]); else { cols.push([p.n+" 33",o=>o.q["33"][p.id]]); cols.push([p.n+" 75",o=>o.q["75"][p.id]]); } });
    const used=cols.filter(([,f])=>S.cur.orders.some(o=>f(o)));
    const b=[["N°","Nom","Prénom","Service","Téléphone","E-mail"].concat(used.map(c=>c[0]),["Composition coffrets",cf.resale?"Payé par l’acheteur":"Montant"])];
    S.cur.orders.forEach(o=>b.push([o.n,o.nom,o.prenom,o.service,o.tel,o.email].concat(used.map(([,f])=>f(o)||""),[o.compo,o.montant])));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(b),"Par personne");
    XLSX.writeFile(wb,"preparation-"+name+".xlsx");
  } else {
    const t=totals(), L=factLines(); const a=[["À facturer – "+v.nom],[v.resp?("Contact : "+v.resp+" "+(v.email||"")):""],[],["Produit","Quantité","Prix brasserie","Total"].concat(cf.resale?["Prix de vente","Encaissé"]:[])];
    L.forEach(l=>a.push([l[0],l[1],l[2],+(l[1]*l[2]).toFixed(2)].concat(cf.resale?[l[3],+(l[1]*l[3]).toFixed(2)]:[])));
    a.push([],["Total à facturer","","",+t.fac.toFixed(2)]); if(cf.resale) a.push(["Encaissé par l’organisateur","","",+t.enc.toFixed(2)],["Marge de l’organisateur","","",+(t.enc-t.fac).toFixed(2)]);
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),"À facturer");
    XLSX.writeFile(wb,"facturation-"+name+".xlsx");
  }
}

function fmtsHtml(fm,scope){ return `<div style="display:grid;gap:6px"><b style="font-size:14px">Formats proposés</b><div class="bar">${FMTS.map(([k,l])=>`<label class="tag" style="display:inline-flex;gap:8px;align-items:center;padding:6px 10px;font-size:14px;color:var(--ink);${fm[k]?"border-color:var(--accent);background:var(--accent-soft)":""}"><input type="checkbox" class="switch" data-scope="${scope}" data-fmt="${k}" ${fm[k]?"checked":""}>${l}</label>`).join("")}</div><p class="note">Les produits d’un format désactivé n’apparaissent pas sur la page de commande. Une vente « coffrets seuls » est possible.</p></div>`; }
function priceTable(prix,resale,scope,fm){
  const catOn=cat=>cat==="soft"?fm.soft:cat==="box"?fm.box:(fm.b33||fm.b75);
  const head=`<tr><th>Produit</th><th>Proposé</th><th class="num">Prix brasserie 33 cl</th><th class="num">Prix brasserie 75 cl</th>${resale?'<th class="num">Prix de vente 33 cl</th><th class="num">Prix de vente 75 cl</th>':""}</tr>`;
  const body=CATS.map(([cat,lab])=>{const ps=P.filter(p=>p.cat===cat); if(!ps.length) return "";
    return `<tr class="group"><td colspan="${resale?6:4}">${lab}${cat==="soft"?" · cartons de 12 × 33 cl à part":cat==="box"?" · prix au coffret":""}${catOn(cat)?"":" · format non proposé"}</td></tr>`+ps.map(p=>{const x=prix[p.id], act=x.on&&catOn(cat);
    const inp=(k,ok)=>!ok?`<span class="muted">–</span>`:`<input class="price" inputmode="decimal" data-scope="${scope}" data-pid="${p.id}" data-k="${k}" value="${fx(x[k])}" ${act?"":"disabled"} aria-label="${esc(p.n)} ${k}">`;
    const box=cat==="box", ok33=box||cat==="soft"||fm.b33, ok75=!box&&cat!=="soft"&&fm.b75;
    return `<tr class="${act?"":"off"}"><td><span class="dot" style="background:${p.c}"></span><b>${esc(p.n)}</b>${p.dispo?"":' <span class="tag">indisponible</span>'}<div class="sub" style="margin-left:20px">${esc(p.s)}</div></td>
      <td><input type="checkbox" class="switch" data-scope="${scope}" data-on="${p.id}" ${x.on?"checked":""} ${catOn(cat)?"":"disabled"} aria-label="Proposer ${esc(p.n)}"></td>
      <td class="num">${box?inp("b",true):inp("b33",ok33)}</td><td class="num">${box?"":inp("b75",ok75)}</td>${resale?`<td class="num">${box?inp("v",true):inp("v33",ok33)}</td><td class="num">${box?"":inp("v75",ok75)}</td>`:""}</tr>`;}).join("");}).join("");
  const M=S.rmode, U=M==="pct"?"%":"€", RV=S.rule[M], f2=v=>M==="pct"?String(v).replace(".",","):fx(v);
  const R=id=>`<input class="price" id="r-${id}-${scope}" data-rk="${id}" value="${f2(RV[id])}" aria-label="Majoration ${id}">`;
  const tools=resale?`<div class="tools" style="display:grid;gap:8px"><div class="bar"><b>Prix de vente rapide</b>
      <span class="seg" role="group" aria-label="Majoration en euros ou en pourcentage"><button type="button" data-rmode="eur" aria-pressed="${M==="eur"}">+ €</button><button type="button" data-rmode="pct" aria-pressed="${M==="pct"}">+ %</button></span>
      <span class="sub">${M==="pct"?"Pourcentage ajouté au prix brasserie, arrondi aux 10 centimes.":"Montant ajouté au prix brasserie."} Tu ajustes ensuite produit par produit si besoin.</span></div>
    <div class="bar"><span style="min-width:120px">Bières classiques</span> + ${R("c33")} ${U} la 33 cl · + ${R("c75")} ${U} la 75 cl</div>
    <div class="bar"><span style="min-width:120px">Bières spéciales</span> + ${R("s33")} ${U} la 33 cl · + ${R("s75")} ${U} la 75 cl</div>
    <div class="bar"><span style="min-width:120px">Softs</span> + ${R("so")} ${U} la 33 cl</div>
    <div class="bar"><span style="min-width:120px">Coffrets</span> + ${R("bx")} ${U} le coffret</div>
    <div><button class="btn small primary" type="button" data-rule="${scope}">Appliquer</button></div></div>`:"";
  return fmtsHtml(fm,scope)+tools+`<div class="scroll"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}
function applyRule(prix,r,mode){ const add=(b,a)=>b==null?null:(mode==="pct"?Math.round(b*(1+a/100)*10)/10:+(b+a).toFixed(2));
  Object.entries(prix).forEach(([k,x])=>{ const p=byId[k]; if(!p) return; if(p.cat==="box"){x.v=add(x.b,r.bx);return;}
    const a33=p.cat==="soft"?r.so:p.cat==="speciale"?r.s33:r.c33, a75=p.cat==="speciale"?r.s75:r.c75; x.v33=add(x.b33,a33); if(p.cat!=="soft") x.v75=add(x.b75,a75); }); }
const hasV = prix => Object.values(prix).some(x=>x.v33!=null||x.v!=null);

function infoFields(d, isNew){
  const f=(k,l,ph,type="text")=>`<div class="field"><label for="d-${k}">${l}</label><input id="d-${k}" data-d="${k}" type="${type}" placeholder="${esc(ph)}" value="${esc(d[k]||"")}" ${k==="code"&&!isNew?"disabled":""}></div>`;
  return `<div class="grid2">${f("nom","Nom de la vente","Ex. APE École Jules Ferry")}${f("code","Code du lien",isNew?"se remplit tout seul":"")}
    ${f("resp","Responsable","Prénom Nom")}${f("email","E-mail du responsable","Pour lui envoyer son lien de suivi","email")}${f("tel","Téléphone du responsable","")}
    ${f("limite","Date limite de commande","","date")}${f("livraison","Date de livraison / retrait","","date")}${f("lieu","Lieu de livraison","Ex. Accueil du site")}${f("creneau","Créneau de retrait","Ex. vendredi 16 h 30 – 18 h")}${f("contact","Contact sur place (affiché aux acheteurs)","Ex. Marie, 06 12 34 56 78")}${f("paiement","Modalités de paiement","Ex. chèque à l’ordre de l’APE")}${f("message","Message d’accueil (page de commande)","Ex. Vente au profit du voyage des CM2")}</div>
    ${isNew?"":`<p class="note">Le code du lien ne change plus une fois la vente créée : les liens ont peut-être déjà été envoyés.</p>`}`;
}
function vNouvelle(){
  const d=S.draft, gs=grillesAll();
  return `<div><button class="back" type="button" data-nav="ventes">← Toutes les ventes</button></div>
  <div class="head"><div><h1>Nouvelle vente</h1><p class="muted">Remplis les infos, choisis une grille de prix, ajuste si besoin.</p></div></div>
  <section class="card"><h2>1. Le client</h2>${infoFields(d,true)}</section>
  <section class="card"><h2>2. Le type de vente</h2>
    <div class="seg" role="group" aria-label="Type de vente"><button type="button" data-ctype="std" data-scope="draft" aria-pressed="${!d.resale}">Standard</button><button type="button" data-ctype="resale" data-scope="draft" aria-pressed="${d.resale}">Revente avec marge</button></div>
    <p class="note">${d.resale?"L’organisateur (asso, club…) t’achète au prix brasserie et revend au prix de vente. La page de commande affiche le prix de vente ; ton récap affiche les deux.":"Les acheteurs paient le prix brasserie. C’est le fonctionnement CSE actuel."}</p></section>
  <section class="card"><h2>3. Les produits et les prix</h2>
    <div class="gcards">${gs.map(g=>`<button type="button" class="gcard ${d.grille===g.id?"sel":""}" data-pick="${esc(g.id)}"><h3>${esc(g.nom)}</h3><span class="note">${esc(g.desc)}</span><span>${Object.values(g.prix).filter(x=>x.on).length} produits ${g.resale?'<span class="tag resale">Revente</span>':""}</span></button>`).join("")}</div>
    ${priceTable(d.prix,d.resale,"draft",d.formats)}
    <label class="bar" style="font-size:14px"><input type="checkbox" id="saveAs" ${d.saveAs?"checked":""}> Enregistrer aussi ces prix comme nouvelle grille, nommée
      <input class="price" style="width:220px;text-align:left" id="saveName" placeholder="Ex. Clubs sportifs" value="${esc(d.saveName||"")}"></label>
  </section>
  <div class="bar"><button class="btn primary" type="button" data-create>Créer la vente et les liens</button><button class="btn" type="button" data-nav="ventes">Annuler</button></div>`;
}

function vGrilles(){
  if(S.gedit){ const g=S.gedit;
    return `<div><button class="back" type="button" data-gback>← Toutes les grilles</button></div>
    <div class="head"><div><h1>${g.id?esc(g.nom):"Nouvelle grille"}</h1></div>${g.id?`<div class="bar"><button class="btn" type="button" data-gdel>Supprimer</button></div>`:""}</div>
    <section class="card"><div class="grid2"><div class="field"><label for="g-nom">Nom de la grille</label><input id="g-nom" data-g="nom" value="${esc(g.nom)}"></div>
      <div class="field"><label for="g-desc">Description</label><input id="g-desc" data-g="desc" value="${esc(g.desc)}"></div></div>
      <div class="bar"><span class="seg" role="group" aria-label="Type"><button type="button" data-ctype="std" data-scope="grille" aria-pressed="${!g.resale}">Standard</button><button type="button" data-ctype="resale" data-scope="grille" aria-pressed="${g.resale}">Revente avec marge</button></span></div>
      ${priceTable(g.prix,g.resale,"grille",g.formats)}
      <div class="bar"><button class="btn primary" type="button" data-gsave>Enregistrer la grille</button><span class="note">Modifier une grille ne change pas les ventes déjà créées avec elle.</span></div></section>`; }
  return `<div class="head"><div><h1>Grilles de prix</h1><p class="muted">Des listes de produits et de prix prêtes à l’emploi pour tes ventes.</p></div>
    <button class="btn primary" type="button" data-gnew>+ Nouvelle grille</button></div>
  <div class="gcards">${grillesAll().map(g=>{const on=Object.values(g.prix).filter(x=>x.on).length;
    return `<button type="button" class="gcard" data-grille="${esc(g.id)}"><h3>${esc(g.nom)} ${g.locked?'<span class="tag">Par défaut</span>':""} ${g.resale?'<span class="tag resale">Revente</span>':""}</h3>
      <span class="note">${esc(g.desc||"")}</span><span class="sub">${on} produits · ${FMTS.filter(([k])=>g.formats[k]).map(([,l])=>l.replace("Carton ","")).join(", ")}</span></button>`;}).join("")}</div>
  <p class="note">La grille « CSE classique » reprend toujours les prix de base du catalogue : pour la modifier, change les prix dans l’onglet Catalogue.</p>`;
}

function vCatalogue(){
  const E=S.catEdit;
  return `<div class="head"><div><h1>Catalogue</h1><p class="muted">Prix de base (grille CSE classique) et disponibilité de chaque produit.</p></div>
    <div class="bar"><button class="btn" type="button" data-newprod>+ Ajouter un produit</button><button class="btn primary" type="button" data-catsave>Enregistrer le catalogue</button></div></div>
  ${S.newProd?newProdHtml():""}
  ${CATS.map(([cat,lab])=>{const ps=P.filter(p=>p.cat===cat); if(!ps.length) return ""; return `<section class="card"><h2>${lab}</h2><div class="scroll"><table><thead><tr><th>Produit</th><th>Disponible</th><th class="num">${cat==="box"?"Prix":"33 cl"}</th><th class="num">${cat==="box"||cat==="soft"?"":"75 cl"}</th>${cat==="box"?"":"<th>Étiquette</th>"}</tr></thead><tbody>
    ${ps.map(p=>{const x=E[p.id]; return `<tr class="${x.dispo?"":"off"}"><td><span class="dot" style="background:${p.c}"></span><b>${esc(p.n)}</b><div class="sub" style="margin-left:20px">${esc(p.s)} ${esc(p.d||"")}</div></td>
      <td><input type="checkbox" class="switch" data-cdispo="${p.id}" ${x.dispo?"checked":""} aria-label="${esc(p.n)} disponible"></td>
      <td class="num"><input class="price" data-cid="${p.id}" data-ck="${cat==="box"?"p":"p33"}" value="${fx(cat==="box"?x.p:x.p33)}"></td>
      <td class="num">${cat==="box"||cat==="soft"?"":`<input class="price" data-cid="${p.id}" data-ck="p75" value="${fx(x.p75)}">`}</td>
      ${cat==="box"?"":`<td><label class="btn ghost small" style="cursor:pointer">${x.img?"✓ Nouvelle image":"Changer l’image"}<input type="file" accept="image/png,image/jpeg,image/webp" data-cimg="${p.id}" hidden></label></td>`}</tr>`;}).join("")}
  </tbody></table></div>${cat==="soft"?'<p class="note">Les softs se commandent en cartons de 12 × 33 cl à part, sans mélange avec les bières.</p>':""}</section>`;}).join("")}`;
}
function newProdHtml(){ const n=S.newProd;
  return `<section class="card"><h2>Nouveau produit</h2><div class="grid2">
    <div class="field"><label for="np-n">Nom</label><input id="np-n" data-np="n" value="${esc(n.n)}" placeholder="Ex. La Nouvelle"></div>
    <div class="field"><label for="np-cat">Catégorie</label><select id="np-cat" data-np="cat">${CATS.filter(([c])=>c!=="box").map(([c,l])=>`<option value="${c}" ${n.cat===c?"selected":""}>${l}</option>`).join("")}</select></div>
    <div class="field"><label for="np-s">Style</label><input id="np-s" data-np="s" value="${esc(n.s)}" placeholder="Ex. Blonde"></div>
    <div class="field"><label for="np-d">Degré</label><input id="np-d" data-np="d" value="${esc(n.d)}" placeholder="Ex. 5,5°"></div>
    <div class="field"><label for="np-p33">Prix 33 cl</label><input id="np-p33" data-np="p33" value="${esc(n.p33)}"></div>
    ${n.cat==="soft"?"":`<div class="field"><label for="np-p75">Prix 75 cl</label><input id="np-p75" data-np="p75" value="${esc(n.p75)}"></div>`}
    <div class="field"><label for="np-c">Couleur</label><input id="np-c" data-np="c" type="color" value="${esc(n.c)}"></div>
    <div class="field"><label for="np-desc">Description (fiche)</label><input id="np-desc" data-np="desc" value="${esc(n.desc)}"></div>
    <div class="field"><label>Étiquette (image)</label><label class="btn small" style="cursor:pointer;justify-self:start">${n.img?"✓ Image choisie":"Choisir une image"}<input type="file" accept="image/png,image/jpeg,image/webp" data-npimg hidden></label></div>
  </div><div class="bar"><button class="btn primary" type="button" data-npadd>Ajouter au catalogue</button><button class="btn" type="button" data-npcancel>Annuler</button></div>
  <p class="note">Le nouveau produit est disponible tout de suite dans la grille CSE classique. Pour les autres grilles et ventes, active-le dans leurs produits.</p></section>`; }
function resizeImg(file){ return new Promise((ok,ko)=>{ const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ const H=130, W=Math.round(im.width*H/im.height); const c=document.createElement("canvas"); c.width=Math.min(W,200); c.height=H; c.getContext("2d").drawImage(im,0,0,c.width,H); let u=c.toDataURL("image/png"); if(u.length>40000) u=c.toDataURL("image/jpeg",.85); ok(u); }; im.onerror=ko; im.src=r.result; }; r.onerror=ko; r.readAsDataURL(file); }); }

function render(){
  document.querySelector("nav.tabs").hidden = S.view==="login";
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",(b.dataset.nav===S.view||((S.view==="vente"||S.view==="nouvelle")&&b.dataset.nav==="ventes"))?"page":"false"));
  const a=$("#app");
  if(S.view!=="login" && !D){ a.innerHTML=`<p class="muted">Chargement…</p>`; return; }
  a.innerHTML = S.view==="login"?vLogin():S.view==="ventes"?vVentes():S.view==="vente"?vVente():S.view==="nouvelle"?vNouvelle():S.view==="grilles"?vGrilles():vCatalogue();
}
function scopeObj(scope){ return scope==="draft"?S.draft:scope==="vente"?S.edit:S.gedit; }
async function load(){ const j=await api("init"); D=j.data; setCat(D.catalogue); }
async function openVente(code){ const j=await api("vente",{code}); setCur(j.data); go("vente",{tab:S.view==="vente"&&S.cur&&S.cur.vente.code===code?S.tab:"apercu",exp:null}); }
function setCur(data){ S.cur=data; const v=data.vente, c=data.config;
  S.edit={nom:v.nom,code:v.code,resp:v.resp,email:v.email,tel:v.tel,limite:v.limite,livraison:v.livraison,lieu:v.lieu,livraisonTxt:v.livraisonTxt,
    creneau:v.creneau,contact:v.contact,message:v.message,paiement:v.paiement,resale:c.resale,grille:c.grille,formats:clone(c.formats),prix:fillPrix(c.prix)};
  const i=D.ventes.findIndex(x=>x.code===v.code); const sv=Object.assign({},v,{configured:c.configured}); if(i>=0) D.ventes[i]=sv; else D.ventes.unshift(sv); }
function venteFields(d){ return {nom:d.nom,code:d.code,resp:d.resp,email:d.email,tel:d.tel,limite:d.limite,livraison:d.livraison,livraisonTxt:d.livraison?"":d.livraisonTxt,lieu:d.lieu,creneau:d.creneau,contact:d.contact,message:d.message,paiement:d.paiement}; }
function cfgOf(d){ return {resale:d.resale,grille:d.grille||"",formats:d.formats,prix:d.prix}; }

document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-open]"); if(!t) return; const d=t.dataset;
  if(d.login!==undefined){ const m=($("#lk").value.match(/k=([A-Za-z0-9]+)/)||[])[1]; if(!m){ toast("Ce lien ne contient pas de clé (#k=…)"); return; } KEY=m; try{localStorage.setItem("bs_espace_k",m);}catch(err){} S.view="ventes"; run("",async()=>{await load(); render();}); return; }
  if(d.nav){ go(d.nav,{gedit:null,newProd:null,catEdit:d.nav==="catalogue"?Object.fromEntries(P.map(p=>[p.id,{dispo:p.dispo,p33:p.p33,p75:p.p75,p:p.p}])):S.catEdit}); return; }
  if(d.refresh!==undefined){ run("",async()=>{await load(); render(); toast("À jour");}); return; }
  if(d.open){ run("",()=>openVente(d.open)); return; }
  if(d.vtab){ S.tab=d.vtab; render(); return; }
  if(d.exp){ S.exp=d.exp; render(); return; }
  if(d.xls){ xls(d.xls); return; }
  if(d.copy){ copy(d.copy); return; }
  if(d.confirmdate!==undefined){ run("",async()=>{ const j=await api("confirmDate",{code:S.cur.vente.code}); setCur(j.data); render(); toast("Date confirmée : l’organisateur est prévenu par e-mail"); }); return; }
  if(d.confirmalt!==undefined){ const x=$("#altdate").value; if(!x){ toast("Choisis d’abord une date"); return; } run("",async()=>{ const j=await api("confirmDate",{code:S.cur.vente.code,livraison:x}); setCur(j.data); render(); toast("Nouvelle date confirmée : l’organisateur est prévenu par e-mail"); }); return; }
  if(d.close!==undefined||d.reopen!==undefined||d.extend!==undefined){ const v=S.cur.vente; let p={code:v.code};
    if(d.close!==undefined) p.statut="Fermé";
    if(d.reopen!==undefined){ p.statut="Ouvert"; if(v.limite&&daysTo(v.limite)<0){ const n=new Date(TODAY); n.setDate(n.getDate()+7); p.limite=n.toISOString().slice(0,10);} }
    if(d.extend!==undefined){ const n=new Date(v.limite+"T12:00"); n.setDate(n.getDate()+7); p.limite=n.toISOString().slice(0,10); }
    run("",async()=>{ const j=await api("statut",p); setCur(j.data); render(); toast(d.close!==undefined?"Vente fermée : le lien affiche « commandes closes »":d.extend!==undefined?"Date limite repoussée au "+dfr(p.limite):"Vente rouverte"); }); return; }
  if(d.saveinfos!==undefined){ run("",async()=>{ const j=await api("saveVente",{orig:S.cur.vente.code,vente:venteFields(S.edit),config:cfgOf(Object.assign({},S.cur.config,{prix:fillPrix(S.cur.config.prix)}))}); setCur(j.data); render(); toast("Infos enregistrées"); }); return; }
  if(d.saveprix!==undefined){ run("",async()=>{ const j=await api("saveVente",{orig:S.cur.vente.code,vente:venteFields(S.cur.vente),config:cfgOf(S.edit)}); setCur(j.data); render(); toast("Produits et prix enregistrés"); }); return; }
  if(d.new!==undefined){ const g=grillesAll()[0]; S.draft={nom:"",code:"",resp:"",email:"",tel:"",limite:"",livraison:"",lieu:"",resale:false,grille:"cse",formats:clone(g.formats),prix:clone(g.prix),saveAs:false,saveName:""}; go("nouvelle"); return; }
  if(d.ctype){ const o=scopeObj(d.scope); o.resale=d.ctype==="resale"; if(o.resale&&!hasV(o.prix)) applyRule(o.prix,S.rule.eur,"eur"); render(); return; }
  if(d.pick!==undefined){ const g=grillesAll().find(x=>x.id===d.pick); Object.assign(S.draft,{grille:g.id,prix:fillPrix(g.prix),formats:clone(g.formats),resale:g.resale}); render(); return; }
  if(d.rmode){ S.rmode=d.rmode; render(); return; }
  if(d.rule){ applyRule(scopeObj(d.rule).prix,S.rule[S.rmode],S.rmode); render(); toast("Prix de vente recalculés"); return; }
  if(d.create!==undefined){ const x=S.draft; if(!x.nom.trim()){ toast("Indique au moins le nom de la vente"); $("#d-nom").focus(); return; }
    run("",async()=>{ let gid=x.grille;
      if(x.saveAs&&x.saveName.trim()){ const r=await api("saveGrille",{grille:{nom:x.saveName.trim(),desc:"Créée avec la vente "+x.nom.trim()+".",resale:x.resale,formats:x.formats,prix:x.prix}}); D.grilles=r.grilles; gid=r.id; }
      const j=await api("saveVente",{vente:venteFields(x),config:Object.assign(cfgOf(x),{grille:gid})}); setCur(j.data); go("vente",{tab:"apercu"}); toast("Vente créée : les deux liens sont prêts."); }); return; }
  if(d.savegrid!==undefined){ const bg=document.createElement("div"); bg.className="dialog-bg";
    bg.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dt"><h3 id="dt">Enregistrer comme grille</h3><div class="field"><label for="gname">Nom de la grille</label><input id="gname" placeholder="Ex. Clubs sportifs"></div><div class="bar"><button class="btn primary" type="button" id="gok">Enregistrer</button><button class="btn" type="button" id="gno">Annuler</button></div></div>`;
    document.body.appendChild(bg); $("#gname").focus(); $("#gno").onclick=()=>bg.remove();
    $("#gok").onclick=()=>{ const n=$("#gname").value.trim(); if(!n){ $("#gname").focus(); return; } run("",async()=>{ const r=await api("saveGrille",{grille:{nom:n,desc:"Créée depuis la vente "+S.cur.vente.nom+".",resale:S.edit.resale,formats:S.edit.formats,prix:S.edit.prix}}); D.grilles=r.grilles; bg.remove(); toast("Grille « "+n+" » enregistrée"); }); }; return; }
  if(d.grille!==undefined){ const g=grillesAll().find(x=>x.id===d.grille); S.gedit=g.locked?Object.assign(clone(g),{id:"",nom:"CSE classique (copie)",desc:"",locked:false}):Object.assign(clone(g),{prix:fillPrix(g.prix)}); if(g.locked) toast("La grille par défaut suit le catalogue : voici une copie modifiable."); render(); window.scrollTo({top:0}); return; }
  if(d.gnew!==undefined){ const g=grillesAll()[0]; S.gedit={id:"",nom:"",desc:"",resale:false,formats:clone(g.formats),prix:clone(g.prix)}; render(); return; }
  if(d.gback!==undefined){ S.gedit=null; render(); return; }
  if(d.gsave!==undefined){ run("",async()=>{ const r=await api("saveGrille",{grille:S.gedit}); D.grilles=r.grilles; S.gedit=null; render(); toast("Grille enregistrée"); }); return; }
  if(d.gdel!==undefined){ if(t.dataset.confirm!=="1"){ t.dataset.confirm="1"; t.textContent="Confirmer la suppression"; return; } run("",async()=>{ const r=await api("delGrille",{id:S.gedit.id}); D.grilles=r.grilles; S.gedit=null; render(); toast("Grille supprimée"); }); return; }
  if(d.catsave!==undefined){ const items=P.map(p=>Object.assign({id:p.id},S.catEdit[p.id])); run("",async()=>{ const r=await api("saveCatalogue",{items}); setCat(r.catalogue); S.catEdit=Object.fromEntries(P.map(p=>[p.id,{dispo:p.dispo,p33:p.p33,p75:p.p75,p:p.p}])); render(); toast("Catalogue enregistré"); }); return; }
  if(d.newprod!==undefined){ S.newProd={n:"",cat:"classique",s:"",d:"",p33:"2,00",p75:"4,50",c:"#17936F",desc:"",img:""}; render(); return; }
  if(d.npcancel!==undefined){ S.newProd=null; render(); return; }
  if(d.npadd!==undefined){ const n=S.newProd; if(!n.n.trim()){ toast("Indique le nom du produit"); return; }
    run("",async()=>{ const r=await api("saveCatalogue",{items:[{nouveau:true,n:n.n,cat:n.cat,s:n.s,d:n.d,p33:num(n.p33),p75:num(n.p75),c:n.c,desc:n.desc,img:n.img}]}); setCat(r.catalogue); S.newProd=null; S.catEdit=Object.fromEntries(P.map(p=>[p.id,{dispo:p.dispo,p33:p.p33,p75:p.p75,p:p.p}])); render(); toast("Produit ajouté"); }); return; }
});
document.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ")&&e.target.matches("tr.row")){ e.preventDefault(); run("",()=>openVente(e.target.dataset.open)); } });
document.addEventListener("change",async e=>{ const el=e.target, d=el.dataset;
  if(d.on){ scopeObj(d.scope).prix[d.on].on=el.checked; render(); return; }
  if(d.fmt){ const f=scopeObj(d.scope).formats; f[d.fmt]=el.checked; if(!Object.values(f).some(Boolean)){ f[d.fmt]=true; toast("Garde au moins un format"); } render(); return; }
  if(d.pid){ scopeObj(d.scope).prix[d.pid][d.k]=num(el.value); return; }
  if(d.rk){ S.rule[S.rmode][d.rk]=num(el.value)||0; return; }
  if(d.cdispo){ S.catEdit[d.cdispo].dispo=el.checked; render(); return; }
  if(d.cid){ S.catEdit[d.cid][d.ck]=num(el.value); return; }
  if(d.cimg&&el.files[0]){ try{ S.catEdit[d.cimg].img=await resizeImg(el.files[0]); render(); toast("Image prête : clique sur Enregistrer le catalogue"); }catch(err){ toast("Image illisible"); } return; }
  if(d.npimg!==undefined&&el.files[0]){ try{ S.newProd.img=await resizeImg(el.files[0]); render(); }catch(err){ toast("Image illisible"); } return; }
  if(d.np){ S.newProd[d.np]=el.value; if(d.np==="cat") render(); return; }
  if(el.id==="saveAs"&&S.draft) S.draft.saveAs=el.checked; });
document.addEventListener("input",e=>{ const el=e.target;
  if(el.dataset.d){ const o=S.view==="nouvelle"?S.draft:S.edit; o[el.dataset.d]=el.value; if(S.view==="nouvelle"&&el.dataset.d==="nom"){ o.code=slug(el.value); const c=$("#d-code"); if(c) c.value=o.code; } }
  if(el.dataset.g&&S.gedit) S.gedit[el.dataset.g]=el.value;
  if(el.dataset.np&&S.newProd) S.newProd[el.dataset.np]=el.value;
  if(el.id==="saveName"&&S.draft){ S.draft.saveName=el.value; S.draft.saveAs=!!el.value.trim(); const c=$("#saveAs"); if(c) c.checked=S.draft.saveAs; } });

render();
if(KEY) run("",async()=>{ await load(); render(); });
</script>
</body></html>
